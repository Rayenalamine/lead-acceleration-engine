name: CI/CD Pipeline - Lead Qualification Engine

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build-and-test:
    name: Backend Build & Test (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven & Run Tests
        run: |
          cd backend
          mvn clean test package -DskipTests=false

  frontend-build:
    name: Frontend Typecheck & Build (React 18 / Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript Check & Vite Build
        run: |
          cd frontend
          npm run build

  docker-build-check:
    name: Docker Compose Config Check
    runs-on: ubuntu-latest
    needs: [backend-build-and-test, frontend-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Docker Compose Configuration
        run: docker compose config
